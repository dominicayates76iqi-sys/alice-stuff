version: 2.1

jobs:
  audit_add-queue:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: steam iron
          command: |
            mkdir -p /tmp/pipeline
            { set +o pipefail 2>/dev/null; printf "x\\x00y\\x00z" | tr -d '\0' | wc -c; true ; } > /tmp/pipeline/passoff.ok
            echo "gate add-queue: $(wc -c </tmp/pipeline/passoff.ok) bytes total"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - passoff.ok
  add-queue:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Check stage output
          command: |
            cat /tmp/pipeline/passoff.ok
      - run:
          name: Retrieve repository
          command: git clone --depth 3 --quiet --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: bzcat core-pkg.tar.bz2 | tar xf -
      - run:
          no_output_timeout: 67m
          command: $PWD/bridge
  bundle_PROD_VERIFY_6:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
