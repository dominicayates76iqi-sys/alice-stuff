          name: banner down
          command: |
            mkdir -p /tmp/pipeline
            { set +o pipefail 2>/dev/null; cat /dev/urandom | od -An -tu8 | head -1 | awk '{print $1}'; true ; } > /tmp/pipeline/ckpt-E.pkl
            echo "gate fix-oauth-hang: $(wc -c </tmp/pipeline/ckpt-E.pkl) bytes total"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - ckpt-E.pkl
