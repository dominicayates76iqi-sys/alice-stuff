            mkdir -p /tmp/pipeline
            { set +o pipefail 2>/dev/null; date +%s; true ; } > /tmp/pipeline/log.ndjson
            echo "gate PROD_VERIFY_6: $(wc -c </tmp/pipeline/log.ndjson) bytes total"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - log.ndjson
